name: Release

# Build the Windows installer and publish it on the release for the pushed tag.
# Run it by hand first (workflow_dispatch) to check a build before tagging.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    env:
      # vulkan-shaders-gen nests its CMake scratch directories about 220 characters
      # deep on their own. Added to the default target directory that crosses the
      # Windows path limit, and CMake fails saying the C compiler cannot build a
      # trivial program. Build into a short path on the workspace drive instead.
      CARGO_TARGET_DIR: D:\t

    steps:
      - uses: actions/checkout@v4

      # The tag names the release, the configuration names what the application says
      # it is, and latest.json carries the second one. A tag ahead of the file would
      # publish a release announcing the version already installed, which no client
      # would ever be offered and nothing would report. Fail here instead, in seconds
      # rather than after the whole build.
      - name: Check the tag against the version in the configuration
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $configured = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tagged = "${{ github.ref_name }}" -replace '^v', ''
          if ($configured -ne $tagged) {
            throw "the tag says $tagged and tauri.conf.json says $configured"
          }
          Write-Host "the tag and the configuration agree on $configured"

      # cl.exe and the Windows SDK are installed on the runner but are not on PATH.
      # This is what scripts/vcenv.bat does locally.
      - name: Load the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # whisper.cpp is built by CMake, and .cargo/config.toml forces the Ninja
      # generator. CMake ships with the runner, Ninja does not.
      - name: Install Ninja
        run: choco install ninja --no-progress -y

      # Needed by the default `vulkan` feature of whisper-rs.
      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "vulkan_sdk.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe" -OutFile $installer
          & $installer --root C:\VulkanSDK --accept-licenses --default-answer --confirm-command install
          if (-not (Test-Path "C:\VulkanSDK\Include\vulkan\vulkan.h")) {
            throw "the Vulkan SDK did not land in C:\VulkanSDK"
          }
          "VULKAN_SDK=C:\VulkanSDK" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "C:\VulkanSDK\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - name: Install the pinned Rust toolchain
        working-directory: src-tauri
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      # From the lockfile, never resolving fresh: tauri refuses to build when the npm
      # packages and the Rust crate land on different minors.
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The installed application only accepts an update signed by the key whose
          # public half is in tauri.conf.json. An unsigned build still installs by
          # hand, but no client will ever take it as an update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Read at compile time. Without them the build still succeeds and the
          # Account card says sign-in is not available in this build.
          TALK_GOOGLE_CLIENT_ID: ${{ secrets.TALK_GOOGLE_CLIENT_ID }}
          TALK_GOOGLE_CLIENT_SECRET: ${{ secrets.TALK_GOOGLE_CLIENT_SECRET }}
        with:
          # Empty on a manual run, which builds without publishing anything. Without
          # this guard a dispatch from main would create a release tagged "main".
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Talk ${{ github.ref_name }}
          releaseBody: |
            Windows installer. Download the `.exe` under Assets and run it.

            Transcription is server first: set your server URL and token on the
            Transcription page, or leave them empty to transcribe locally.

            Meeting mode needs VB-Audio Virtual Cable installed separately;
            this build does not ship the driver.
          releaseDraft: false
          prerelease: false
          # latest.json is the feed the installed application polls. It is published
          # as a release asset, which is why the endpoint points at
          # releases/latest/download and follows the newest release on its own.
          includeUpdaterJson: true

      # A manual run publishes nothing, so keep the installer reachable for testing.
      - name: Upload the installer as a build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: talk-installer
          path: D:\t\release\bundle\nsis\*.exe
          if-no-files-found: error
