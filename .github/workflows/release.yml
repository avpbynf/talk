name: Release

# Build the Windows installer and publish it on the release for the pushed tag, then build the
# Debian package and attach it to that same release.
# Run it by hand first (workflow_dispatch) to check a build before tagging.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    env:
      # vulkan-shaders-gen nests its CMake scratch directories about 220 characters
      # deep on their own. Added to the default target directory that crosses the
      # Windows path limit, and CMake fails saying the C compiler cannot build a
      # trivial program. Build into a short path on the workspace drive instead.
      CARGO_TARGET_DIR: D:\t

    steps:
      - uses: actions/checkout@v4

      # The tag names the release, the configuration names what the application says
      # it is, and latest.json carries the second one. A tag ahead of the file would
      # publish a release announcing the version already installed, which no client
      # would ever be offered and nothing would report. Fail here instead, in seconds
      # rather than after the whole build.
      - name: Check the tag against the version in the configuration
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $configured = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tagged = "${{ github.ref_name }}" -replace '^v', ''
          if ($configured -ne $tagged) {
            throw "the tag says $tagged and tauri.conf.json says $configured"
          }
          Write-Host "the tag and the configuration agree on $configured"

      # The release page says what the version does in the words of the changelog, so
      # the section named after the tag is cut out here. A tag whose section is missing
      # or empty stops now, for the same reason as above: before the build, not after.
      - name: Cut the section of this version out of the changelog
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith("## [$version]")) { $start = $i; break }
          }
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $version" }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith("## [")) { $end = $i; break }
          }
          $section = if ($end -gt $start + 1) { ($lines[($start + 1)..($end - 1)] -join "`n").Trim() } else { "" }
          if (-not $section) { throw "the section for $version in CHANGELOG.md is empty" }
          $notes = @(
            'Windows installer. Download the `.exe` under Assets and run it; an installed Talk offers this version by itself.'
            ''
            'Meeting mode needs VB-Audio Virtual Cable installed separately; this build does not ship the driver.'
            ''
            $section
          ) -join "`n"
          $file = Join-Path $env:RUNNER_TEMP "release-notes.md"
          [System.IO.File]::WriteAllText($file, $notes + "`n", [System.Text.UTF8Encoding]::new($false))
          "RELEASE_NOTES=$file" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "$($section.Length) characters of notes for $version"

      # cl.exe and the Windows SDK are installed on the runner but are not on PATH.
      # This is what scripts/vcenv.bat does locally.
      - name: Load the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # whisper.cpp is built by CMake, and .cargo/config.toml forces the Ninja
      # generator. CMake ships with the runner, Ninja does not.
      - name: Install Ninja
        run: choco install ninja --no-progress -y

      # Needed by the default `vulkan` feature of whisper-rs.
      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "vulkan_sdk.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe" -OutFile $installer
          & $installer --root C:\VulkanSDK --accept-licenses --default-answer --confirm-command install
          if (-not (Test-Path "C:\VulkanSDK\Include\vulkan\vulkan.h")) {
            throw "the Vulkan SDK did not land in C:\VulkanSDK"
          }
          "VULKAN_SDK=C:\VulkanSDK" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "C:\VulkanSDK\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - name: Install the pinned Rust toolchain
        working-directory: src-tauri
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      # From the lockfile, never resolving fresh: tauri refuses to build when the npm
      # packages and the Rust crate land on different minors.
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The installed application only accepts an update signed by the key whose
          # public half is in tauri.conf.json. An unsigned build still installs by
          # hand, but no client will ever take it as an update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Read at compile time. Without them the build still succeeds and the
          # Account card says sign-in is not available in this build.
          TALK_GOOGLE_CLIENT_ID: ${{ secrets.TALK_GOOGLE_CLIENT_ID }}
          TALK_GOOGLE_CLIENT_SECRET: ${{ secrets.TALK_GOOGLE_CLIENT_SECRET }}
        with:
          # Empty on a manual run, which builds without publishing anything. Without
          # this guard a dispatch from main would create a release tagged "main".
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Talk ${{ github.ref_name }}
          # Short on purpose: this text is also copied into latest.json, which every
          # installed copy downloads each time it looks for an update. The release page
          # gets the changelog section in the step after this one.
          releaseBody: Windows installer. Download the `.exe` under Assets and run it.
          releaseDraft: false
          prerelease: false
          # latest.json is the feed the installed application polls. It is published
          # as a release asset, which is why the endpoint points at
          # releases/latest/download and follows the newest release on its own.
          includeUpdaterJson: true

      - name: Put the changelog section on the release page
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release edit "${{ github.ref_name }}" --notes-file $env:RELEASE_NOTES

      # A manual run publishes nothing, so keep the installer reachable for testing.
      - name: Upload the installer as a build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: talk-installer
          path: D:\t\release\bundle\nsis\*.exe
          if-no-files-found: error

  # The Debian package rides on the release the windows job created, and never on the updater:
  # latest.json stays the Windows manifest, and the Linux configuration writes no updater
  # artifacts. It waits for the windows job so the release exists and nothing races its notes
  # edit; `gh release upload` then adds one asset to it.
  linux:
    needs: windows
    runs-on: ubuntu-24.04

    env:
      # Same reason as the windows job: keep whisper.cpp's CMake scratch directories short.
      CARGO_TARGET_DIR: /tmp/t

    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux dependencies plus the audio, keyboard and D-Bus headers, as
      # docs/building.md lists them. The distribution's Vulkan headers are too old for the
      # current whisper.cpp on 24.04, so the SDK is unpacked below instead of libvulkan-dev.
      - name: Install the system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libasound2-dev libxkbcommon-dev libdbus-1-dev \
            cmake ninja-build clang libclang-dev libvulkan1 xz-utils

      # scripts/tauri-linux.sh finds the newest setup-env.sh under ~/vulkan and loads it.
      - name: Install the Vulkan SDK
        run: |
          mkdir -p "$HOME/vulkan"
          curl -fsSL https://sdk.lunarg.com/sdk/download/latest/linux/vulkan_sdk.tar.xz \
            | tar -xJ -C "$HOME/vulkan"
          setup="$(find "$HOME/vulkan" -maxdepth 4 -name setup-env.sh | sort -V | tail -n 1)"
          test -n "$setup"
          # The final link needs libvulkan.so, which libvulkan1 does not carry and the
          # distribution's -dev package would bring older headers along with. A link to the
          # runtime library, on the linker's search path, is all it asks for.
          mkdir -p "$HOME/vulkan-link"
          ln -s /usr/lib/x86_64-linux-gnu/libvulkan.so.1 "$HOME/vulkan-link/libvulkan.so"
          test -e "$HOME/vulkan-link/libvulkan.so"
          echo "LIBRARY_PATH=$HOME/vulkan-link" >> "$GITHUB_ENV"

      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - name: Install the pinned Rust toolchain
        working-directory: src-tauri
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # The signature is asked for here and not in tauri.linux.conf.json, so a local
      # `bun run tauri:build:linux` still works without the private key.
      - name: Build the signed Debian package
        env:
          # Same key as the Windows installer: the installed application accepts an
          # update only if it is signed by the public half in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Read at compile time, as in the windows job.
          TALK_GOOGLE_CLIENT_ID: ${{ secrets.TALK_GOOGLE_CLIENT_ID }}
          TALK_GOOGLE_CLIENT_SECRET: ${{ secrets.TALK_GOOGLE_CLIENT_SECRET }}
        run: |
          bun run tauri:build:linux --config '{"bundle":{"createUpdaterArtifacts":true}}'
          ls -l "$CARGO_TARGET_DIR"/release/bundle/deb/
          test -f "$CARGO_TARGET_DIR"/release/bundle/deb/*.deb.sig

      # The updater reads one latest.json, so the Linux entry goes into the manifest the
      # windows job already published instead of replacing it. Windows keeps its own keys,
      # and an installed .deb looks for `linux-x86_64-deb`.
      - name: Attach the package and its update entry to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deb="$(ls "$CARGO_TARGET_DIR"/release/bundle/deb/*.deb)"
          gh release upload "${{ github.ref_name }}" "$deb" "$deb.sig" --clobber
          url="$(gh release view "${{ github.ref_name }}" --json assets \
            --jq ".assets[] | select(.name == \"$(basename "$deb")\") | .url")"
          test -n "$url"
          gh release download "${{ github.ref_name }}" --pattern latest.json --dir "$RUNNER_TEMP" --clobber
          jq --arg url "$url" --arg sig "$(cat "$deb.sig")" \
            '.platforms["linux-x86_64-deb"] = {signature: $sig, url: $url}' \
            "$RUNNER_TEMP/latest.json" > "$RUNNER_TEMP/merged.json"
          jq -e '.platforms | has("windows-x86_64") and has("linux-x86_64-deb")' "$RUNNER_TEMP/merged.json"
          mv "$RUNNER_TEMP/merged.json" "$RUNNER_TEMP/latest.json"
          gh release upload "${{ github.ref_name }}" "$RUNNER_TEMP/latest.json" --clobber

      # A manual run publishes nothing, so keep the package reachable for testing.
      - name: Upload the package as a build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: talk-deb
          path: |
            /tmp/t/release/bundle/deb/*.deb
            /tmp/t/release/bundle/deb/*.deb.sig
          if-no-files-found: error
